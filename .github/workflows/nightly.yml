# Nightly developer builds and device e2e (omni-plan §6.6.2 principle 3, §6.6.3, §12) — kept off the release path.
#   dev-build    <variant>-dev-sim per variant: Android dev-client APK (emulator-installable). No iOS builds in CI:
#                iOS dev, simulator and ad-hoc builds are made on a Mac (pnpm ios:adhoc, scripts/ci/maestro-ios.sh)
#   e2e-android  Maestro flows on an Android emulator against the dev-client APK + Metro; one variant per night
#                (rotates by UTC day) unless e2e_variants says otherwise
#   warm-caches  pnpm stores, Electron and Playwright downloads on the default branch, so PR and release runs hit them
name: Nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Dev builds for: all, or comma-separated variants'
        type: string
        default: all
      e2e_variants:
        description: 'Maestro e2e: rotate, all, none, or comma-separated variants'
        type: string
        default: rotate

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_DOTENV: '1'
  EAS_CLI_VERSION: '27.3.0'
  MAESTRO_VERSION: '2.11.0'
  PLAYWRIGHT_VERSION: '1.64.1'

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      variants: ${{ steps.select.outputs.variants }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          install: none
      - name: Select variants
        id: select
        env:
          VARIANTS: ${{ inputs.variants || 'all' }}
          E2E: ${{ inputs.e2e_variants || 'rotate' }}
        run: node scripts/ci/variants-matrix.mjs --variants "$VARIANTS" --e2e "$E2E"

  dev-build:
    name: dev build (${{ matrix.variant }}, android)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only EXPO_TOKEN is used; dev builds keep the development settings (QA API, no Firebase, no production keys). The
    # QA API is named here: an unset BASE_API_URL falls back to production US West (plan §15 #22).
    environment: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      APP_VARIANT: ${{ matrix.variant }}
      APP_ENV: development
      BASE_API_URL: https://qaapi.resgrid.dev
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NODE_OPTIONS: --max_old_space_size=4096
      # The dev-sim APK runs on emulators: x86_64 for the CI emulator (e2e-android), arm64-v8a for Apple-silicon ones.
      # This overrides the ARM-only reactNativeArchitectures that @resgrid/config-plugins (custom-gradle) writes to
      # gradle.properties for store builds; without it libreactnative.so is missing on x86_64 and the app dies at start.
      # Set here, not in eas.json or the plugin, so no runtime fingerprint changes.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64,arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space and move temp dirs off tmpfs
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/eas-build"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-workspace
      - uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Restore EAS local build cache
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: eas-build-local-android-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: eas-build-local-android-
      - name: Profile
        id: profile
        run: node scripts/ci/eas-profile.mjs dev --variant "$APP_VARIANT" --platform android
      - name: Build (eas build --local)
        working-directory: apps/omni
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          eas build --local --platform android --profile "$PROFILE" --non-interactive --output "$GITHUB_WORKSPACE/out/${APP_VARIANT}-dev-sim.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.variant }}-android
          path: out/
          retention-days: 7
          if-no-files-found: error

  e2e-android:
    name: maestro android (${{ matrix.variant }})
    needs: [plan, dev-build]
    if: ${{ !cancelled() && needs.plan.outputs.e2e != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.e2e) }}
    env:
      APP_VARIANT: ${{ matrix.variant }}
      APP_ENV: development
      # Metro serves the client settings: QA, as the dev build was made for (an unset value would be production).
      BASE_API_URL: https://qaapi.resgrid.dev
      # Every adb server this job starts (the emulator runner's, Maestro's) runs without mDNS: adb 37's mDNS bridge can
      # abort the server, which Maestro sees as "device offline" (apps/omni/e2e/README.md, QA regression).
      ADB_MDNS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: dev-${{ matrix.variant }}-android
          path: ${{ runner.temp }}/app
      - name: Install Maestro
        run: |
          bash scripts/ci/retry.sh 3 15 bash -c 'curl -fsSL "https://get.maestro.mobile.dev" | bash'
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Start Metro
        run: bash scripts/ci/start-metro.sh android "$RUNNER_TEMP/metro.log"
      - name: Maestro on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ runner.temp }}/app/${{ matrix.variant }}-dev-sim.apk
          MAESTRO_OUTPUT: ${{ github.workspace }}/maestro-output
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/maestro-android.sh
      - name: Upload Maestro results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-${{ matrix.variant }}
          path: |
            maestro-output
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
            /tmp/adb.*.log
          retention-days: 7
          if-no-files-found: ignore

  # Caches written on the default branch are readable from every branch (PRs, merge queue, release).
  warm-caches:
    name: warm caches (${{ matrix.os }}, ${{ matrix.install }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, install: full }
          - { os: macos-26, install: full }
          - { os: ubuntu-latest, install: desktop }
          - { os: windows-latest, install: desktop }
          - { os: macos-15, install: desktop }
    steps:
      - uses: actions/checkout@v4
      - name: Electron caches
        if: matrix.install == 'desktop'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Point Electron at the cache
        if: matrix.install == 'desktop'
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-cache/electron-builder" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-workspace
        with:
          install: ${{ matrix.install }}
      - name: Playwright browsers cache
        if: matrix.os == 'ubuntu-latest' && matrix.install == 'full'
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Download Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.install == 'full' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/retry.sh 3 15 node scripts/ci/run-playwright.mjs install chromium
