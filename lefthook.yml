# Git hooks (omni-plan §6.1) — installed by `pnpm install` via the `prepare` script.
# Commands run repo-wide with caches instead of passing staged file lists: large commits exceed the
# Windows command-line limit, and cached runs only re-check changed files anyway.
# Tools run from node_modules/.bin, not through `pnpm exec`: the npm-installed global pnpm shim calls
# `cygpath`, which GitHub Desktop's bundled Git does not ship, so every hook failed from Desktop.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: node_modules/.bin/eslint . --max-warnings 0 --cache --cache-location node_modules/.cache/eslint
    # Oxlint anti-slop rules against tooling/oxlint/anti-slop-baseline.json: no file may gain a finding (about 2 s).
    anti-slop:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: node scripts/ci/anti-slop.mjs
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css}'
      run: node_modules/.bin/prettier --check --cache "**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css}"
commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}
