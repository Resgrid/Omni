# Content-Security-Policy (Unit/IC web policy, plus media, frames and plugin/base restrictions). The API host, map tiles,
# Sentry and Countly are all https; realtime is wss. Replaced at container start when CONTENT_SECURITY_POLICY is set
# (docker/entrypoint.sh).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: data: blob:; media-src 'self' data: blob: https:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https: blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
