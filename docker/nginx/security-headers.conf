# Security headers for every response (included in the server block and in every location that sets its own headers,
# because nginx drops inherited add_header directives as soon as a location adds one).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;
include /etc/nginx/resgrid/csp.conf;
