# Asserts the app reached its first screen: HomePlaceholder (@resgrid/app-shell, testID `home-placeholder`) when
# signed in, or the ShellGate (testID `shell-gate`: onboarding or sign-in) on a fresh install. Both show the
# variant's identity.name. React Native testIDs are resource-ids on Android and accessibility identifiers on iOS,
# so `id:` (a regex) works on both.
# Variables: APP_ID, APP_NAME, APP_VARIANT.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'home-placeholder|shell-gate'
    # A dev client builds the Metro bundle on first open; allow for a cold transform cache.
    timeout: 300000
- assertVisible:
    text: ${APP_NAME}
- takeScreenshot: home-${APP_VARIANT}
