# nginx for the Resgrid Omni web image (omni-plan §6.4): Dispatch's caching rules (no-store entry HTML and runtime env,
# long cache for hashed bundles, hidden files denied, Referrer-Policy) with Unit/IC's CSP, passkey association files and
# /health, and an SPA fallback for client-side routes.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml application/wasm;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Redirects stay relative, so a reverse proxy in front never sees the container's own port.
        absolute_redirect off;

        include /etc/nginx/resgrid/security-headers.conf;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Entry HTML and runtime configuration: never cached, so a redeploy or an env change takes effect on reload.
        location = /index.html {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri =404;
        }

        location = /env-config.js {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri =404;
        }

        # Push service worker and export metadata: browsers must revalidate them, so not immutable like hashed bundles.
        location ~ ^/(service-worker\.js|metadata\.json|manifest\.json)$ {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Passkey / app association files: served as JSON when this deployment provides them, otherwise a 404 — an exact
        # match wins over the hidden-file rule and the SPA fallback, so they are never answered with index.html.
        location = /.well-known/apple-app-site-association {
            default_type application/json;
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /.well-known/assetlinks.json {
            default_type application/json;
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Content-hashed bundles and assets from expo export: cache for a year.
        location ^~ /_expo/static/ {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /assets/ {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Hidden files and folders (.env, .git, ...) are never served.
        location ~ /\. {
            access_log off;
            log_not_found off;
            deny all;
        }

        # Other HTML (static-rendered routes) is entry HTML too.
        location ~* \.html$ {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri =404;
        }

        # Unhashed static files at the root (favicon, public/ files): a short cache; a missing one is a 404, not HTML.
        location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|eot|wasm|mp3|wav|ogg|mp4|webm|json|map|txt|pmtiles)$ {
            include /etc/nginx/resgrid/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # SPA fallback: client-side routes get index.html (whose own location sets no-store).
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
