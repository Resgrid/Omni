# Resgrid Omni workspace (omni-plan §6.1). One version per dependency: every package.json
# references these with `catalog:` so the five apps can never drift apart again.
packages:
  - apps/*
  - packages/*
  - tooling/*

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - electron
  - esbuild
  - lefthook
  - protobufjs
  - sharp
  - unrs-resolver

overrides:
  form-data: 4.0.6
  lightningcss: 1.30.1

